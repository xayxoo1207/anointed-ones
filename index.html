<script>
'use strict';
// ================= CORE =================

  light.width=W;light.height=H;S=s;

  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0.7)');g.fillStyle=gr;g.fillRect(0,0,W,H);
  redV=mk(W,H);{const g2=redV.getContext('2d'),r2=g2.createRadialGradient(W/2,H/2,Math.min(W,H)*0.32,W/2,H/2,Math.max(W,H)*0.6);r2.addColorStop(0,'rgba(200,0,0,0)');r2.addColorStop(0.55,'rgba(200,0,0,0.35)');r2.addColorStop(1,'rgba(150,0,0,0.95)');g2.fillStyle=r2;g2.fillRect(0,0,W,H)}
}

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;

// ================= SPRITES =================

  h:'#4f5536',H:'#6c7448',u:'#5e5c3a',U:'#3d3c26',T:'#4b5a36',t:'#6d8050',n:'#2c4a2a',N:'#4f7a3e',q:'#5a5f66',Q:'#80868e',a:'#7d6c48',A:'#a8946a',o:'#ff8a2a'};
function raw(rows,pal){const w=Math.max(...rows.map(r=>r.length)),h=rows.length,c=mk(w,h),x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<rows[j].length;i++){const ch=rows[j][i];if(ch==='.'||ch===' ')continue;const col=pal[ch];if(!col)continue;x.fillStyle=col;x.fillRect(i,j,1,1)}return c}
function flip(c){const d=mk(c.width,c.height),x=d.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return d}

function spr(rows,pal){const i=raw(rows,pal);const w=white(i);return{i,f:flip(i),w,wf:flip(w),W:i.width,H:i.height}}
const SD={};

  for(let y=0;y<5;y++)for(let x=0;x<3;x++)if(b[y*3+x]==='1')for(const[ox,oy]of[[0,1],[2,1],[1,0],[1,2],[2,2],[0,0],[2,0],[0,2]])g.fillRect(x+ox,y+oy,1,1);

  for(let y=0;y<h;y++){const t=(y+0.5)/h*2-1,hw=Math.round(w/2*Math.sqrt(1-t*t));g.fillRect(w/2-hw,y,hw*2,1)}return shadowCache[w]=c}

  mStep++;mNext+=spb}}

 else if(g.k==='manna'){P.hp=Math.min(P.maxHp,P.hp+20);sfx('heal');G.nums.push({x:P.x,y:P.y-14,v:20,t:0.8,c:'g'})}
 else if(g.k==='flare'){for(const o of G.gems)if(o.k==='xp')o.vac=true;sfx('heal');banner('','',0)}

}
function updParts(dt){if(!G)return;for(const p of G.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt;if(p.type==='smoke'){p.vx*=0.96;p.vy*=0.96;p.vy-=8*dt}else if(p.type==='fire'){p.vx*=0.92;p.vy*=0.92}}G.parts=G.parts.filter(p=>p.life>0)}

// ================= WEATHER =================
function initWeather(){G.wx=[];const t=G.b.weather;const n={leaf:45,rain:130,ash:80,snow:120,sand:100,storm:200}[t]||0;for(let i=0;i<n;i++)G.wx.push(newWx(t))}
function newWx(t){const o={x:rnd(W),y:rnd(H),t:rnd(10)};
 if(t==='rain'||t==='storm'){o.vx=t==='storm'?-120:-50;o.vy=rnd(260,340);o.len=rnd(3,6)}
 else if(t==='snow'){o.vx=rnd(-15,-5);o.vy=rnd(15,35);o.sz=Math.random()<0.2?2:1}
 else if(t==='leaf'){o.vx=rnd(-20,-8);o.vy=rnd(10,22);o.col=pick(['#3a5a2a','#5a4a2a','#2a3a1e','#6a6a3a'])}
 else if(t==='ash'){o.ember=Math.random()<0.3;o.vx=rnd(-10,10);o.vy=o.ember?rnd(-30,-10):rnd(6,16)}
 else if(t==='sand'){o.vx=rnd(-260,-160);o.vy=rnd(10,30);o.len=rnd(4,10)}
 return o}
function updWeather(dt,cdx,cdy){if(!G)return;const t=G.b.weather;for(const o of G.wx){o.t+=dt;o.x+=o.vx*dt-cdx*0.9;o.y+=o.vy*dt-cdy*0.9;if(t==='snow'||t==='leaf')o.x+=Math.sin(o.t*2)*0.3;
  if(o.x<-10)o.x+=W+20;if(o.x>W+10)o.x-=W+20;if(o.y<-10)o.y+=H+20;if(o.y>H+10)o.y-=H+20}
 if(t==='storm'){lightning-=dt;if(lightning<-rnd(4,9)){lightning=0.35;sfx('thunder')}}}

 for(let i=0;i<40;i++){const a=rnd(TAU),sp=rnd(40,140);part(P.x,P.y,Math.cos(a)*sp,Math.sin(a)*sp,rnd(0.5,1),pick(['#ffd34a','#fff3b0','#ff9a2a']),2,0,'fire')}
 const e=EVO[w.k];slots();
 screen(`<div class="panel"><div class="op" style="color:#ffd34a">WEAPON EVOLUTION</div><div class="big" style="color:#ffd34a">무기 진화!</div><div class="rg">모루 위에서 무기가 새롭게 단련되었다</div>
 <div class="evo-row"><div class="card"><img src="${ICON[w.k]}"><div class="lv">LV 8</div><div class="nm">${WDEF[w.k].name}</div></div><span class="pl">+</span>
 <div class="card"><img src="${ICON[e.p]}"><div class="nm">${PDEF[e.p].name}</div></div><span class="pl">▼</span>
 <div class="card gold"><img src="${ICON[w.k]}"><div class="lv">★ EVO</div><div class="nm">${e.name}</div><div class="ds">${e.desc}</div></div></div>
 <div style="margin-top:calc(var(--p)*8)"><div class="btn primary" data-act="evook">계속</div></div></div>`)}
function checkReady(){for(const w of P.weapons)if(evoReady(w)&&!w.noted){w.noted=true;banner('진화 준비 완료',`${WDEF[w.k].name} → ${EVO[w.k].name} · 미니보스의 모루를 획득하라`,2.6)}}
function recipes(){return '<table class="rec">'+Object.keys(EVO).filter(k=>!WDEF[k].hero||WDEF[k].hero===P.hero).map(k=>{const e=EVO[k],w=P.weapons.find(x=>x.k===k);const cls=w&&w.evo?'ok':w?'have':'';
 return `<tr class="${cls}"><td><img src="${ICON[k]}"> ${WDEF[k].name}${w&&!w.evo?' '+w.lv:''}</td><td>+</td><td><img src="${ICON[e.p]}"> ${PDEF[e.p].name}${P.pass[e.p]?' ✓':''}</td><td>▶</td><td>${w&&w.evo?'★ ':''}${e.name}</td></tr>`}).join('')+'</table>'}
// level up
function options(){const o=[];
 for(const w of P.weapons)if(w.lv<WMAX)o.push({t:'w',k:w.k,lv:w.lv+1});
 if(P.weapons.length<MAXW)for(const k in WDEF)if(!WDEF[k].hero&&!P.weapons.find(w=>w.k===k))o.push({t:'w',k,lv:1});
 for(const k in PDEF)if((P.pass[k]||0)<PMAX)o.push({t:'p',k,lv:(P.pass[k]||0)+1});
 for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
 const r=o.slice(0,3);if(!r.length){r.push({t:'f'});r.push({t:'auto'})}return r}
function wdiff(k,lv){if(lv===1)return WDEF[k].desc;const a=WS[k](lv-1),b=WS[k](lv);const out=[];
 for(const key in b)if(a[key]!==b[key]){const f=v=>key==='cd'?v.toFixed(2)+'s':key==='ang'?Math.round(v*114)+'°':(Math.round(v*10)/10);out.push(`${WLBL[key]} ${f(a[key])}→${f(b[key])}`)}return out.join('<br>')||WDEF[k].desc}
function applyOpt(o){if(o.t==='w'){const w=P.weapons.find(w=>w.k===o.k);if(w)w.lv++;else P.weapons.push({k:o.k,lv:1,t:0.2})}
  else if(o.t==='p'){P.pass[o.k]=(P.pass[o.k]||0)+1;recompute()}else{P.hp=Math.min(P.maxHp,P.hp+20);if(o.t==='auto')P.autoFood=true}}
function autoLevel(n){for(let i=0;i<n;i++){const ops=options();applyOpt(ops.find(o=>o.t==='w'&&o.lv>1)||ops.find(o=>o.t==='w')||ops[0]);P.lv++}
  P.next=xpNeed(P.lv);for(const w of P.weapons)if(evoReady(w)){w.evo=true;w.shown=true;w.noted=true}P.hp=P.maxHp}
function openLevelUp(){state='levelup';sfx('lvl');const ops=options();
 const cards=ops.map((o,i)=>{if(o.t==='auto')return`<div class="card auto" data-i="${i}"><img src="${ICON.food}"><div class="lv">AUTO</div><div class="nm">자동 선택</div><div class="ds">게임이 끝날 때까지 레벨업 화면 없이<br>만나(체력 20)를 자동으로 받습니다</div><div class="k">${i+1}</div></div>`;
  if(o.t==='f')return`<div class="card" data-i="${i}"><img src="${ICON.food}"><div class="nm">만나</div><div class="ds">체력 20 회복 (작은 회복)</div><div class="k">${i+1}</div></div>`;
  const d=o.t==='w'?WDEF[o.k]:PDEF[o.k];let ds=o.t==='w'?wdiff(o.k,o.lv):d.desc;
  if(o.t==='w')ds+=`<div class="evo-h">★ 진화: LV8 + ${PDEF[EVO[o.k].p].name}</div>`;else{const wk=Object.keys(EVO).find(k=>EVO[k].p===o.k&&(!WDEF[k].hero||WDEF[k].hero===P.hero));if(wk)ds+=`<div class="evo-h">★ ${WDEF[wk].name} → ${EVO[wk].name} 재료${P.weapons.find(w=>w.k===wk)?' (보유 중)':''}</div>`}
  return`<div class="card" data-i="${i}"><img src="${ICON[o.k]}"><div class="lv ${o.lv===1?'new':''}">${o.lv===1?'NEW':'LV '+o.lv}</div><div class="nm">${d.name}</div><div class="ds">${ds}</div><div class="k">${i+1}</div></div>`}).join('');
 screen(`<div class="panel"><div class="op" style="color:#ffd34a">PROMOTION</div><div class="big" style="font-size:calc(var(--p)*18)">레벨 업!${G.pending>1?` <span style="font-size:calc(var(--p)*9);color:#c8b898">+${G.pending-1}</span>`:''}</div><div class="cards">${cards}</div></div>`);
 document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{const o=ops[+c.dataset.i];
  applyOpt(o);
  G.pending--;sfx('click');slots();checkReady();hideScreen();state='play';if(G.pending>0)openLevelUp()},{once:true}))}

// ================= DEV =================
const DEV=location.hash==='#dev';
function devKey(c){if(!G)return;if(c==='KeyB'&&!G.bossSpawned){G.t=G.st.dur}if(c==='KeyV'&&G.miniIdx<4){G.t=G.nextMini}if(c==='KeyL')G.pending++;if(c==='KeyK'&&G.boss)G.boss.hp=1;if(c==='KeyN'&&state==='play'){G.clearT=0.01}if(c==='KeyE'){for(const k in EVO){let w=P.weapons.find(x=>x.k===k);if(!w){w={k,lv:1,t:0};P.weapons.push(w)}w.lv=WMAX;P.pass[EVO[k].p]=1}recompute();slots()}if(c==='KeyC')G.gems.push({x:P.x+20,y:P.y,k:'anvil'});}
window.__fs={evolve,get G(){return G},get P(){return P},get state(){return state},newRunBrief,startPlay,nextStage,openLevelUp};

// ================= LOOP =================
let last=performance.now();
function loop(now){const dt=Math.min(1/30,(now-last)/1000);last=now;try{update(dt);render()}catch(err){console.error(err)}requestAnimationFrame(loop)}
resize();initStatic();toTitle();requestAnimationFrame(loop);
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>

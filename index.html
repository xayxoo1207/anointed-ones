function tone(type,f0,f1,dur,vol,delay=0,dest){const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+dur+0.05)}

 leviathan:{t:'리워야단',d:'바다의 거대한 괴물, 날랜 뱀이요 꼬불꼬불한 뱀. 그 입에서는 횃불이 나오고 불꽃이 튀어 나오며 입김은 숯불을 지핀다. 그 날에 여호와께서 견고하고 크고 강한 칼로 벌하시리라 예언되었다.',r:'욥기 41:19-21 · 이사야 27:1'},

const MINILORE={tank:'calf',heli:'fly',heavy:'molech',gunboat:'dagon'};
const sprURL={};function bossImg(key,fr){if(!sprURL[key])sprURL[key]=fr.toDataURL();return sprURL[key]}
let introT=0,introId=0;
function bossIntro(items,final){if(state!=='play')return;state='intro';introT=performance.now();const id=++introId;
 const rows=items.map(it=>`<div class="bi-row"><img src="${it.img}"><div><div class="bi-tag" style="color:${final?'#ff4a3a':'#ffb04a'}">${final?'FINAL BOSS':'MINI BOSS'}</div><div class="bi-name">${it.t}</div><div class="bi-desc">${it.d}</div><div class="bi-ref">${it.r}</div></div></div>`).join('');
 screen(`<div class="panel bi">${rows}<div class="nkey">터치하여 계속하세요</div></div>`,'intro');
}
function leaveIntro(force){if(!force&&performance.now()-introT<600)return;hideScreen();state='play';sfx('click')}
function spawnMinis(k){const L=MST[G.si];if(L&&L.length>=3&&SPR.mini0){const idx=[[0],[1],[2],[0,2]][k];for(const i of idx){const m=L[i];const hp=1400*(1+G.d*0.4)*(1+k*0.7)/idx.length*1.3;const e=makeBoss({bt:m.bt||(G.b.land?'tank':'ship'),spr:'mini'+i,sc:1,r:m.s==='tank'||m.s==='gunboat'?20:17,name:m.n,hp,mini:true});G.minis.push(e);if(m.pack){e.pack=1;e.pk=6;after(0.5,()=>packRing(12))}}sfx('alarm');shake=4;bossIntro(idx.map(i=>{const m=L[i];return{t:m.n,d:m.d,r:m.r,img:bossImg('mm_'+G.si+'_'+i,SPR['mini'+i][0].i)}}),false);return}
  const list=MINIS[G.b.land?'land':'sea'][k];const names=[];
  for(const t of list){const d=MINIDEF[t];const hp=1400*(1+G.d*0.4)*(1+k*0.7)/list.length*1.3;const e=makeBoss(Object.assign({},d,{hp,mini:true}));G.minis.push(e);names.push(d.name)}
  sfx('alarm');shake=4;bossIntro(list.map(t=>{const L=LORE[MINILORE[t]];return{t:L.t,d:L.d,r:L.r,img:bossImg('m_'+t+G.si,SPR[MINIDEF[t].spr][0].i)}}),false)}
function spawnBoss(){G.bossSpawned=true;const st=G.st;
  const hp=16000*([0.62,0.75,0.88][G.si]||1)*(1+G.d*0.4)*(st.final?1.5:1);
  const conf=BOSSES[st.boss];
  for(const o of G.en){if(o.dead||o.boss)continue;o.dead=true;dropGem(o.x,o.y,o.xp);for(let k=0;k<4;k++)part(o.x,o.y-4,rnd(-30,30),rnd(-50,-10),0.5,pick(['#ffffff','#fff3b0','#ffe08a']),1,-20,'crumb')}
  for(const m of G.minis)if(!m.dead){m.hp=0;kill(m)}G.ebul.length=0;G.emarks.length=0;after(0.3,()=>{for(const g of G.gems)g.vac=true});addLight(P.x,P.y,260,'rgba(255,245,220,1)',0.5);
  G.boss=makeBoss({bt:conf.bt,spr:'boss',sc:1,r:conf.r,hp:hp*1.3,name:st.bossName});
  sfx('alarm');shake=6;{const L=LORE[st.boss];bossIntro([{t:L.t,d:L.d,r:L.r,img:bossImg('b_'+st.boss,SPR.boss[0].i)}],true)}}
function curBoss(){if(G.boss&&!G.boss.dead)return G.boss;return G.minis.find(m=>!m.dead)||null}

// ================= COMBAT =================
let grid=new Map();const CELL=32;
function buildGrid(){grid=new Map();for(const e of G.en){if(e.dead)continue;const k=(Math.floor(e.x/CELL)+5000)*10000+(Math.floor(e.y/CELL)+5000);let a=grid.get(k);if(!a){a=[];grid.set(k,a)}a.push(e)}}
function query(x,y,r,cb){const x0=Math.floor((x-r)/CELL),x1=Math.floor((x+r)/CELL),y0=Math.floor((y-r)/CELL),y1=Math.floor((y+r)/CELL);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const a=grid.get((cx+5000)*10000+(cy+5000));if(a)for(const e of a)if(!e.dead)cb(e)}}
function hurt(e,dmg,kx=0,ky=0,noNum){if(e.dead)return;if(P.lightL){kx*=1+0.2*P.lightL;ky*=1+0.2*P.lightL;if(!e.boss&&!(e.slowT>0&&e.slowM<0.7)){e.slowT=0.35;e.slowM=1-0.06*P.lightL}}dmg*=P.dmgMul*(1+0.1*ML('crown'));if(P.pass.name&&(e.boss||e.elite||e.type==='heli'))dmg*=1+0.15*P.pass.name;const crit=Math.random()<P.crit+(P.critE||0);if(crit)dmg*=P.critM||2;dmg=Math.max(1,Math.round(dmg));
  e.hp-=dmg;e.flash=0.08;const k=1-e.kbRes;e.kx+=kx*k;e.ky+=ky*k;
  if(!noNum&&G.nums.length<90)G.nums.push({x:e.x+rnd(-3,3),y:e.y-e.h/2,v:dmg,t:0.6,c:crit?'y':'w'});
  sfx('hit');if(e.hp<=0)kill(e)}

// ===== death crumble / blood =====
function pixList(c){if(c._px)return c._px;const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data,o=[];
  for(let j=0;j<c.height;j++)for(let i=0;i<c.width;i++){const p=(j*c.width+i)*4;if(d[p+3]>0)o.push([i,j,`rgb(${d[p]},${d[p+1]},${d[p+2]})`])}return c._px=o}
function enemyFrame(e){const set=SPR[e.spr];if(!set)return null;const fr=set[Math.floor(e.anim)%set.length];return{img:e.face<0?fr.f:fr.i,sc:e.sc||1,W:fr.W,H:fr.H}}
function crumble(e,fr,red,step){const sc=fr.sc,w=fr.W*sc,h=fr.H*sc,x0=e.x-w/2,y0=e.y-h/2-(e.alt||0);const px=pixList(fr.img);step=step||1;
  for(let n=0;n<px.length;n+=step){const[i,j,c]=px[n];if(!red&&c==='rgb(11,10,18)'&&Math.random()<0.6)continue;const wx=x0+i*sc,wy=y0+j*sc,dx=wx-e.x,dy=wy-(y0+h/2);
    G.parts.push({x:wx,y:wy,vx:dx*rnd(2,4.5)+rnd(-18,18),vy:dy*rnd(1.5,3)-rnd(20,70),life:rnd(0.35,0.75),max:0.75,col:red?pick(['#ffffff','#fff3b0','#ffd34a','#f0e6c8']):c,size:Math.max(1,Math.round(sc*(step>1?1.5:1))),grav:260,type:'crumb'})}}
function bleed(e,n,spirit){const cols=spirit?['#c8b8f0','#e8e0ff','#a898d8']:['#ffffff','#fff3b0','#f0e6c8','#ffe08a'];
  for(let i=0;i<n;i++){const a=rnd(TAU),s=rnd(15,60);G.parts.push({x:e.x,y:e.y-(e.alt||0)-2,vx:Math.cos(a)*s,vy:Math.sin(a)*s*0.6-rnd(20,50),life:rnd(0.35,0.7),max:0.7,col:pick(cols),size:pick([1,1,2]),grav:-20,type:'crumb'})}
  }
function bossDissolve(e,T){const fr=enemyFrame(e);if(!fr)return;G.dying.push({e:{x:e.x,y:e.y,alt:e.alt||0,face:e.face,anim:e.anim,spr:e.spr,sc:e.sc||1},fr,t:0,T})}
function updDying(dt){if(!G.dying)return;for(const d of G.dying){d.t+=dt;if(!d.done&&d.t>=d.T){d.done=true;crumble(d.e,d.fr,true,2);crumble(d.e,d.fr,false,3);bleed(d.e,40,false);sfx('bigboom');shake=Math.max(shake,4)}}G.dying=G.dying.filter(d=>!d.done)}
function drawDying(d,cx,cy){const fr=d.fr,sc=fr.sc,w=fr.W*sc,h=fr.H*sc,k=Math.min(1,d.t/(d.T*0.8));const jx=Math.round(rnd(-1,1)*k*2),jy=Math.round(rnd(-1,1)*k*2);
  const x=Math.round(d.e.x-cx-w/2)+jx,y=Math.round(d.e.y-cy-h/2-d.e.alt)+jy;
  const t=redTmp(fr.img);const tc=t.getContext('2d');tc.clearRect(0,0,t.width,t.height);tc.globalCompositeOperation='source-over';tc.drawImage(fr.img,0,0);tc.globalCompositeOperation='source-atop';tc.fillStyle=`rgba(${200+Math.round(55*k)},${Math.round(40*(1-k))},${Math.round(30*(1-k))},${k})`;tc.fillRect(0,0,t.width,t.height);tc.globalCompositeOperation='source-over';
  ctx.drawImage(t,x,y,w,h);if(k>0.5){ctx.globalAlpha=(k-0.5)*0.6;ctx.drawImage(fr.img===fr.img?t:t,x-1,y,w,h);ctx.globalAlpha=1}}
const _redT={};function redTmp(img){const key=img.width+'x'+img.height;if(!_redT[key])_redT[key]=mk(img.width,img.height);return _redT[key]}
function iceBurst(x,y,r,dmg){let hit=false;query(x,y,r+12,e=>{const dx=e.x-x,dy=e.y-y,d=Math.hypot(dx,dy)||1;if(d<r+e.r*0.5){hurt(e,dmg,dx/d*50,dy/d*50);hit=true}});
 for(let i=0;i<14;i++){const a=rnd(TAU),s=rnd(40,130);part(x,y-2,Math.cos(a)*s,Math.sin(a)*s-30,rnd(0.25,0.5),pick(['#ffffff','#d8f2ff','#9fd8ff','#6ab8ec']),pick([1,1,2]),260)}
 for(let i=0;i<4;i++)part(x+rnd(-r*0.4,r*0.4),y+rnd(-r*0.2,r*0.2),0,0,0.35,'rgba(200,235,255,0.6)',2,0,'smoke');
 addLight(x,y,r*2,'rgba(190,230,255,1)',0.25);if(hit)sfx('ice')}
function kill(e){e.dead=true;G.kills++;G.stageKills++;sfx('die');
  if(!e.boss){const fr=enemyFrame(e);if(fr)crumble(e,fr,false,e.elite?2:1);bleed(e,e.elite?22:9,e.type==='heli')}else bossDissolve(e,e.mini?1.0:1.6);
  for(let i=0;i<4;i++)part(e.x,e.y,rnd(-20,20),rnd(-20,20),0.4,'rgba(200,200,200,0.5)',2,0,'smoke');
  for(let i=0;i<3;i++)part(e.x+rnd(-3,3),e.y,rnd(-10,10),rnd(-55,-25),0.7,pick(['#fff3b0','#ffd34a']),1);
  if(e.boss){if(e.mini)miniDeath(e);else bossDeath(e);return}
  dropGem(e.x,e.y,e.xp);
  if(Math.random()<0.02*(1+0.15*ML('luck'))*(1+0.12*G.d)*(1+0.2*(P.pass.tempt||0))*(1+0.08*ML('tempt'))*(e.elite?20:1))G.gems.push({x:e.x+rnd(-4,4),y:e.y+rnd(-4,4),k:'prayer'});
  const r=Math.random();if(r<0.015)G.gems.push({x:e.x,y:e.y,k:'manna'});else if(r<0.0185)G.gems.push({x:e.x,y:e.y,k:'med'});else if(r<0.02)G.gems.push({x:e.x,y:e.y,k:'flare'});else if(r<0.0215)G.gems.push({x:e.x,y:e.y,k:'lots'});
  if(e.elite?Math.random()<0.35:((e.type==='tank'||e.type==='gunboat')&&Math.random()<0.08))G.gems.push({x:e.x,y:e.y,k:'crate'});
  if(e.elite)explode(e.x,e.y,30,0,true);
  if(e.type==='tank'||e.type==='heli'||e.type==='gunboat')explode(e.x,e.y,18,0,true)}
function dropGem(x,y,v){if(G.gems.length>450){const g=G.gems.find(g=>g.k==='xp');if(g){g.v+=v;return}}G.gems.push({x:x+rnd(-3,3),y:y+rnd(-3,3),k:'xp',v})}
function part(x,y,vx,vy,life,col,size=1,grav=0,type){if(G.parts.length>700)return;G.parts.push({x,y,vx,vy,life,max:life,col,size,grav,type})}
function addLight(x,y,r,col,life){G.fx.push({x,y,r,col,life,max:life})}
function explode(x,y,r,dmg,visualOnly,enemy,snd){if(!enemy&&P&&P.area)r*=P.area;
  if(!visualOnly&&dmg>0){buildGridIfNeeded();query(x,y,r+12,e=>{const dx=e.x-x,dy=e.y-y,d=Math.hypot(dx,dy);if(d<r+e.r){hurt(e,dmg,dx/(d||1)*80,dy/(d||1)*80)}})}
  if(enemy){const dx=P.x-x,dy=P.y-y;if(Math.hypot(dx,dy)<r+5)hurtPlayer(dmg)}
  const n=Math.min(26,8+r*0.6);
  for(let i=0;i<n;i++){const a=rnd(TAU),s=rnd(20,r*4);part(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(0.2,0.5),pick(['#fff3b0','#ffd34a','#ff8a2a','#ff4a1a']),pick([1,2,2,3]),0,'fire')}

  try{const r=await CL.api.load(CL.user.uid),local=snapSave();
    if(r&&r.data&&JSON.stringify(r.data)!==JSON.stringify(local)&&progScore(r.data)>progScore(local)){applySave(r.data);return}
    CL.busy=false;await cloudPush(local,true)}catch(e){CL.msg='동기화 실패 · 인터넷 연결을 확인하세요'}finally{CL.busy=false;refreshCloud()}}
async function cloudPush(d,force){if(!CL.user)return;d=d||snapSave();const j=JSON.stringify(d);if(j===CL.last&&!force)return;
  await CL.api.save(CL.user.uid,{data:d,updated:Date.now(),name:CL.user.name||''});CL.last=j;const t=new Date();CL.msg='클라우드 저장 완료 · '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');refreshCloud()}
function applySave(d){try{for(const k of SAVE_KEYS){if(d[k]!=null)localStorage.setItem(k,d[k]);else localStorage.removeItem(k)}}catch(e){}CL.last=JSON.stringify(d);location.reload()}
function cloudHtml(){if(!FB_CONFIG)return'';
  let h='<div class="orow"><div class="ol">구글 계정 연동</div><div id="cloudbox">';
  if(CL.err)h+='<div class="cmsg">연동 모듈을 불러오지 못했어요 · 인터넷 연결 후 다시 열어 주세요</div>';
  else if(!CL.ready)h+='<div class="cmsg">불러오는 중…</div>';
  else if(CL.user)h+=`<div class="cuser">${(CL.user.name||'')}<small>${CL.user.email||''}</small></div><div class="seg"><div class="btn" data-act="gsync">지금 저장</div><div class="btn" data-act="glogout">로그아웃</div></div><div class="cmsg">${CL.msg||'로그인되어 있어요 · 기록이 자동으로 저장돼요'}</div>`;
  else h+=`<div class="btn wide gbtn" data-act="glogin"><b>G</b> Google로 로그인</div><div class="cmsg">로그인하면 기록이 클라우드에 저장되어 다른 기기나 앱을 다시 설치해도 이어서 할 수 있어요</div>`;
  return h+'</div></div>'}
function refreshCloud(){const b=document.getElementById('cloudbox');if(b){const t=document.createElement('div');t.innerHTML=cloudHtml();const nb=t.querySelector('#cloudbox');if(nb)b.replaceWith(nb)}}
setInterval(()=>{if(CL.user&&!CL.busy&&state!=='play')cloudPush().catch(()=>{})},15000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveBattle();if(state==='play'){for(const k in keys)keys[k]=false;joy=null;openPause()}}});addEventListener('pagehide',()=>{saveBattle();if(state==='play'){joy=null;openPause()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&CL.user)cloudPush().catch(()=>{})});

// ================= LOOP =================
let last=performance.now();
function loop(now){const dt=Math.min(1/30,(now-last)/1000);last=now;try{update(dt);render()}catch(err){console.error(err)}requestAnimationFrame(loop)}
resize();initStatic();buildTitleHeroes();showNotice();requestAnimationFrame(loop);cloudInit();
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>

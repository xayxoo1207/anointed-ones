let AC=null,master=null,musicG=null,sfxG=null,bgmG=null,noiseBuf=null,muted=false;const lastS={};
function applyVol(){if(sfxG)sfxG.gain.value=Math.pow(OPT.sfx/100,1.5)*1.0;if(bgmG)bgmG.gain.value=Math.pow(OPT.bgm/100,1.5)*1.0}
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.32;master.connect(AC.destination);musicG=AC.createGain();musicG.gain.value=0.5;sfxG=AC.createGain();sfxG.connect(master);bgmG=AC.createGain();bgmG.connect(master);musicG.connect(bgmG);applyVol();
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;setInterval(musicTick,25)}catch(e){AC=null}}
function tone(type,f0,f1,dur,vol,delay=0,dest){const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+dur+0.05)}
function nz(dur,vol,freq,delay=0,type='lowpass',dest,q=1){const t=AC.currentTime+delay,s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);s.connect(f);f.connect(g);g.connect(dest||sfxG);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05)}
const THR={sling:0.08,shot:0.05,hit:0.04,die:0.05,pick:0.03,boom:0.06,flame:0.12};
function sfx(n){if(!AC||muted)return;const now=AC.currentTime;if(lastS[n]&&now-lastS[n]<(THR[n]||0.02))return;lastS[n]=now;
 switch(n){
  case'shot':nz(0.07,0.25,2400,0,'bandpass');tone('square',300,90,0.05,0.06);break;
  case'sniper':nz(0.25,0.5,1600,0,'lowpass');tone('sawtooth',900,60,0.2,0.12);break;
  case'hit':tone('square',220,120,0.04,0.05);break;
  case'die':nz(0.1,0.15,900,0,'lowpass');break;

  case'bigboom':nz(1.2,0.8,350,0,'lowpass');tone('sine',70,22,1,0.7);break;
  case'pick':tone('square',900+Math.random()*300,1400,0.05,0.04);break;
  case'lvl':[523,659,784,1046].forEach((f,i)=>tone('square',f,f,0.12,0.08,i*0.07));break;
  case'hurt':tone('sawtooth',200,60,0.2,0.18);nz(0.15,0.2,1200);break;
  case'throw':tone('triangle',500,250,0.15,0.06);break;
  case'whistle':tone('sine',1800,500,0.6,0.05);break;
  case'jet':nz(1.4,0.3,800,0,'bandpass');tone('sawtooth',300,120,1.2,0.05);break;

function shadeDecor(c){const w=c.width,h=c.height,x=c.getContext('2d'),im=x.getImageData(0,0,w,h),d=im.data;
  const o=[parseInt(OUT.slice(1,3),16),parseInt(OUT.slice(3,5),16),parseInt(OUT.slice(5,7),16)];
  const solid=(i,j)=>{if(i<0||j<0||i>=w||j>=h)return false;const p=(j*w+i)*4;return d[p+3]>0&&!(d[p]===o[0]&&d[p+1]===o[1]&&d[p+2]===o[2])};
  const src=new Uint8ClampedArray(d);let x0=w,x1=0,y0=h,y1=0;for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(solid(i,j)){x0=Math.min(x0,i);x1=Math.max(x1,i);y0=Math.min(y0,j);y1=Math.max(y1,j)}
  const sw=Math.max(1,x1-x0),sh=Math.max(1,y1-y0);const S=(i,j)=>{if(i<0||j<0||i>=w||j>=h)return false;const p=(j*w+i)*4;return src[p+3]>0&&!(src[p]===o[0]&&src[p+1]===o[1]&&src[p+2]===o[2])};
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(!S(i,j))continue;const p=(j*w+i)*4;
    let L=0.55*(1-(j-y0)/sh)+0.45*(1-(i-x0)/sw);
    if(!S(i-1,j)||!S(i,j-1))L+=0.32;if(!S(i+1,j)||!S(i,j+1))L-=0.3;if(!S(i+1,j+1)&&S(i+1,j)&&S(i,j+1))L-=0.12;
    if(Math.abs(L-0.5)<0.06&&(i+j)%2)L+=L<0.5?-0.08:0.08;
    const k=L>0.85?0.26:L>0.62?0.1:L>0.38?0:L>0.18?-0.16:-0.3;
    if(k>0){d[p]+=(255-d[p])*k;d[p+1]+=(246-d[p+1])*k;d[p+2]+=(214-d[p+2])*k}else if(k<0){const m=1+k;d[p]*=m;d[p+1]*=m;d[p+2]=d[p+2]*m+12*(-k)}}
  x.putImageData(im,0,0);return c}

    if(v>=6){g.fillStyle=b.spk[2]||b.spk[0];
      if(b.detail==='grass'){for(let i=0;i<3;i++){const x=Math.floor(rnd(2,14)),y=Math.floor(rnd(3,14));g.fillStyle='#46602f';g.fillRect(x,y,1,2);g.fillRect(x-1,y+1,1,1);g.fillRect(x+1,y,1,2);g.fillStyle='#1a2414';g.fillRect(x-1,y+2,3,1)}}

    ranged:null,rcd:0,kx:0,ky:0,flash:0,anim:rnd(4),face:1,alt:d.fly?18:0,spr:type,orb:rnd(TAU)};
  e.mhp=e.hp;const s=SPR[type][0];e.w=s.W;e.h=s.H;G.en.push(e);return e}

  const alive=G.en.length,cap=Math.round((140+G.si*15+Math.floor(G.t/30))*0.8);
  let rate=(1.2+G.t/40)*(1+G.si*0.25)*0.8;if(G.boss)rate*=0.35;else if(G.minis.some(m=>!m.dead))rate*=0.6;
  G.spawnAcc+=rate*dt;
  const pool=(G.b.land?POOL_LAND:POOL_SEA).filter(p=>G.t>=p[0]*Math.max(0.3,1-G.si*0.12));
  const tot=pool.reduce((a,p)=>a+p[2],0);
  while(G.spawnAcc>=1){G.spawnAcc--;if(alive>=cap)continue;let r=rnd(tot),ty=pool[0][1];for(const p of pool){r-=p[2];if(r<=0){ty=p[1];break}}const[x,y]=ringPos();spawnEnemy(ty,x,y)}
  if(G.t>=G.evt&&!G.boss){G.evt+=60;const ty=G.b.land?(Math.random()<0.5?'grunt':'dog'):'frog';const n=Math.round((24+G.si*4)*0.8);banner('어둠의 포위',((ROSTER[G.si]||{}).grp||'적의 무리')+'가 사방에서 몰려온다!',1.6);
    for(let i=0;i<n;i++){const a=i/n*TAU,R=Math.hypot(W,H)/2+10;spawnEnemy(ty,P.x+Math.cos(a)*R,P.y+Math.sin(a)*R)}}
  if(G.t>=G.elite&&!G.boss&&!G.bossSpawned&&!G.minis.some(m=>!m.dead)){G.elite+=80;const ty=G.b.land?(G.si>=1&&Math.random()<0.5?'tank':'heavy'):'gunboat';const[x,y]=ringPos(20);const e=spawnEnemy(ty,x,y,ty==='heavy'?9:4);
    e.elite=true;{const m=e.w>24?1.4:2;e.sc=m;e.w*=m;e.h*=m}e.r=Math.round(e.r*1.8);e.kbRes=1;e.xp*=4;banner('강한 적 출현 · '+(((ROSTER[G.si]||{})[ty]||['강한 적'])[0]),'처치 시 축복의 상자 확정 획득',1.8);sfx('alarm')}
  if(G.miniIdx<4&&G.t>=G.nextMini){G.nextMini+=180;spawnMinis(G.miniIdx++)}
  if(!G.bossSpawned&&G.t>=G.st.dur)spawnBoss();
}

let grid=new Map();const CELL=32;
function buildGrid(){grid=new Map();for(const e of G.en){if(e.dead)continue;const k=(Math.floor(e.x/CELL)+5000)*10000+(Math.floor(e.y/CELL)+5000);let a=grid.get(k);if(!a){a=[];grid.set(k,a)}a.push(e)}}
function query(x,y,r,cb){const x0=Math.floor((x-r)/CELL),x1=Math.floor((x+r)/CELL),y0=Math.floor((y-r)/CELL),y1=Math.floor((y+r)/CELL);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const a=grid.get((cx+5000)*10000+(cy+5000));if(a)for(const e of a)if(!e.dead)cb(e)}}
function hurt(e,dmg,kx=0,ky=0,noNum){if(e.dead)return;dmg*=P.dmgMul;const crit=Math.random()<P.crit;if(crit)dmg*=2;dmg=Math.max(1,Math.round(dmg));
  e.hp-=dmg;e.flash=0.08;const k=1-e.kbRes;e.kx+=kx*k;e.ky+=ky*k;
  if(!noNum&&G.nums.length<90)G.nums.push({x:e.x+rnd(-3,3),y:e.y-e.h/2,v:dmg,t:0.6,c:crit?'y':'w'});
  sfx('hit');if(e.hp<=0)kill(e)}
function kill(e){e.dead=true;G.kills++;G.stageKills++;sfx('die');
  const ep=G.b.enemy;for(let i=0;i<(e.boss?0:6);i++)part(e.x,e.y,rnd(-60,60),rnd(-80,10),rnd(0.3,0.6),pick([ep.u,ep.U,OUT,'#7a1c1c']),1,200);
  for(let i=0;i<4;i++)part(e.x,e.y,rnd(-20,20),rnd(-20,20),0.4,'rgba(200,200,200,0.5)',2,0,'smoke');
  for(let i=0;i<3;i++)part(e.x+rnd(-3,3),e.y,rnd(-10,10),rnd(-55,-25),0.7,pick(['#fff3b0','#ffd34a']),1);
  if(e.boss){if(e.mini)miniDeath(e);else bossDeath(e);return}
  dropGem(e.x,e.y,e.xp);
  if(Math.random()<0.03*(1+0.15*ML('luck'))*(e.elite?20:1))G.gems.push({x:e.x+rnd(-4,4),y:e.y+rnd(-4,4),k:'prayer'});
  const r=Math.random();if(r<0.025)G.gems.push({x:e.x,y:e.y,k:'manna'});else if(r<0.031)G.gems.push({x:e.x,y:e.y,k:'med'});else if(r<0.036)G.gems.push({x:e.x,y:e.y,k:'flare'});
  if(e.elite||((e.type==='tank'||e.type==='gunboat')&&Math.random()<0.25))G.gems.push({x:e.x,y:e.y,k:'crate'});
  if(e.elite)explode(e.x,e.y,30,0,true);
  if(e.type==='tank'||e.type==='heli'||e.type==='gunboat')explode(e.x,e.y,18,0,true)}
function dropGem(x,y,v){if(G.gems.length>450){const g=G.gems.find(g=>g.k==='xp');if(g){g.v+=v;return}}G.gems.push({x:x+rnd(-3,3),y:y+rnd(-3,3),k:'xp',v})}
function part(x,y,vx,vy,life,col,size=1,grav=0,type){if(G.parts.length>700)return;G.parts.push({x,y,vx,vy,life,max:life,col,size,grav,type})}
function addLight(x,y,r,col,life){G.fx.push({x,y,r,col,life,max:life})}
function explode(x,y,r,dmg,visualOnly,enemy){
  if(!visualOnly&&dmg>0){buildGridIfNeeded();query(x,y,r+12,e=>{const dx=e.x-x,dy=e.y-y,d=Math.hypot(dx,dy);if(d<r+e.r){hurt(e,dmg,dx/(d||1)*80,dy/(d||1)*80)}})}
  if(enemy){const dx=P.x-x,dy=P.y-y;if(Math.hypot(dx,dy)<r+5)hurtPlayer(dmg)}
  const n=Math.min(26,8+r*0.6);
  for(let i=0;i<n;i++){const a=rnd(TAU),s=rnd(20,r*4);part(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(0.2,0.5),pick(['#fff3b0','#ffd34a','#ff8a2a','#ff4a1a']),pick([1,2,2,3]),0,'fire')}
  for(let i=0;i<n*0.6;i++){const a=rnd(TAU),s=rnd(5,r*1.5);part(x+rnd(-4,4),y+rnd(-4,4),Math.cos(a)*s,Math.sin(a)*s-15,rnd(0.6,1.2),pick(['#3a3434','#4a4442','#2a2626']),pick([2,3,4]),0,'smoke')}
  for(let i=0;i<5;i++)part(x,y,rnd(-80,80),rnd(-140,-40),rnd(0.4,0.8),OUT,1,300);
  addLight(x,y,r*3,'rgba(255,170,80,1)',0.35);shake=Math.max(shake,0.6*Math.min(5,r/7));sfx(r>40?'bigboom':'boom');
  if(G.b.land&&G.decals.length<70)G.decals.push({x,y,r:Math.min(16,r*0.5),a:1});if(G.decals.length>=70)G.decals.shift()}

   for(const e of G.en){if(e.dead||e.boss)continue;const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)||1;if(d<140){e.kx+=dx/d*400;e.ky+=dy/d*400}}G.ebul.length=0;

function updEvo(w,dt){w.t-=dt;

function pixelize(src,w,h,side){const lo=mk(w,h),lg=lo.getContext('2d');lg.imageSmoothingEnabled=true;lg.imageSmoothingQuality='high';lg.drawImage(src,0,0,w,h);
 const id=lg.getImageData(0,0,w,h),d=id.data;const op=new Uint8Array(w*h);for(let i=0;i<w*h;i++)op[i]=d[i*4+3]>110?1:0;
 const out=lg.createImageData(w,h),o=out.data,q=v=>Math.round(v/18)*18;
 const at=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&op[y*w+x];
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x,j=i*4;
  if(op[i]){let r=d[j],g=d[j+1],b=d[j+2];const a=d[j+3]/255;r/=a;g/=a;b/=a;
   const eT=!at(x,y-1),eL=!at(x-1,y)&&side!=='R',eR=!at(x+1,y)&&side!=='L';
   if(eT||eL||eR){const k=eT?0.5:0.38;r=r*(1-k)+255*k;g=g*(1-k)+210*k;b=b*(1-k)+120*k}
   else{const sh=0.94-0.14*(y/h);r*=sh;g*=sh;b*=sh*0.95}
   o[j]=Math.min(255,q(r));o[j+1]=Math.min(255,q(g));o[j+2]=Math.min(255,q(b));o[j+3]=255}
  else if(at(x-1,y)||at(x+1,y)||at(x,y-1)||at(x,y+1)){o[j]=11;o[j+1]=10;o[j+2]=18;o[j+3]=255}}
 lg.putImageData(out,0,0);return lo}

   <div class="hint" style="font-size:calc(var(--p)*8)">${ok?'엘리야의 축복으로 새 무기를 얻거나 무기를 강화할 수 있다.':'말씀을 마음에 새기고 다시 싸움터로 나아가라.'}</div>
   <div class="btn primary" data-act="quizok" data-ok="${ok?1:0}">${ok?'축복 받기 ▶':'계속 ▶'}</div></div>`)},ok?700:1100)}
function closeQuiz(ok){hideScreen();state='play';if(G.npc)G.npc.leave=0.01;banner('엘리야',ok?'회오리바람을 타고 하늘로 올라갔다 · 축복을 받았다':'회오리바람을 타고 하늘로 올라갔다',1.6);if(ok)G.pending++}

// ================= DEV =================
const DEV=location.hash==='#dev';
function devKey(c){if(!G)return;if(c==='KeyB'&&!G.bossSpawned){G.t=G.st.dur}if(c==='KeyV'&&G.miniIdx<4){G.t=G.nextMini}if(c==='KeyL')G.pending++;if(c==='KeyK'&&G.boss)G.boss.hp=1;if(c==='KeyN'&&state==='play'){G.clearT=0.01}if(c==='KeyE'){for(const k in EVO){let w=P.weapons.find(x=>x.k===k);if(!w){w={k,lv:1,t:0};P.weapons.push(w)}w.lv=WMAX;P.pass[EVO[k].p]=1}recompute();slots()}if(c==='KeyC')G.gems.push({x:P.x+20,y:P.y,k:'anvil'});}
window.__fs={evolve,get G(){return G},get P(){return P},get state(){return state},newRunBrief,startPlay,nextStage,openLevelUp};

// ================= LOOP =================
let last=performance.now();
function loop(now){const dt=Math.min(1/30,(now-last)/1000);last=now;try{update(dt);render()}catch(err){console.error(err)}requestAnimationFrame(loop)}
resize();initStatic();buildTitleHeroes();showNotice();requestAnimationFrame(loop);
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
